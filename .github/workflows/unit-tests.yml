name: Unit Tests

on:
  push:
    branches:
      - phase0/reconcile-source-20261117
      - f1/project-scoped-cob-20261119
      - p17b/operational-readiness-20261122
      - p18/regulatory-core-20261123
      - p19/operational-readiness-plan-20261123
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - phase0/reconcile-source-20261117

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies (refreshed lockfiles)
        run: npm ci --include=dev --no-audit
      - name: Run offline security and unit tests
        run: npm test
      - name: Run dedicated P19 operational assurance contracts
        run: npm run verify:p19-assurance
      - name: Verify Production migration ledger and release gates
        run: npm run verify:release-migrations
      - name: Verify applied Migration 052 and pre-apply backup evidence
        run: npm run verify:migration-052
      - name: Verify prepared Migration 054 permission boundary contract
        run: npm run verify:migration-054
      - name: Verify prepared Migration 055 PM governance RLS contract
        run: npm run verify:migration-055
      - name: Run migration runner dry-run (no database connection)
        run: npm run migrate:dry-run
      - name: Build backend application
        run: npm run build
      - name: Typecheck backend API
        run: npx tsc -p api/tsconfig.json --noEmit
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --include=dev --no-audit
      - name: Typecheck frontend
        run: npm run typecheck --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
