name: Unit Tests

on:
  push:
    branches:
      - phase0/reconcile-source-20261117
      - f1/project-scoped-cob-20261119
      - p17b/operational-readiness-20261122
      - p18/regulatory-core-20261123
      - p19/operational-readiness-plan-20261123
      - p20/platform-continuation-20261123
      - p20/pm-appointment-first-20261126
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - phase0/reconcile-source-20261117
      - p19/operational-readiness-plan-20261123
      - p20/platform-continuation-20261123

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies (refreshed lockfiles)
        run: npm ci --include=dev --no-audit
      - name: Run offline security and unit tests
        run: npm test
      - name: Run connected P22 export lifecycle backtest
        run: npx vitest run src/simulation/phase-j-full-process-backtest.test.ts
      - name: Run P23 operational UX gap matrix
        run: npx vitest run src/ux/phase-o-operational-readiness-matrix.test.ts
      - name: Run dedicated P19 operational assurance contracts
        run: npm run verify:p19-assurance
      - name: Verify Production migration ledger and release gates
        run: npm run verify:release-migrations
      - name: Verify applied Migration 052 and pre-apply backup evidence
        run: npm run verify:migration-052
      - name: Verify prepared Migration 054 permission boundary contract
        run: npm run verify:migration-054
      - name: Verify prepared Migration 055 PM governance RLS contract
        run: npm run verify:migration-055
      - name: Run migration runner dry-run (no database connection)
        run: npm run migrate:dry-run
      - name: Verify PM appointment-first Migration 113 release pin
        run: npm run verify:pm113-release
      - name: Verify PM appointment reactivation Migration 114 release pin
        run: npm run verify:pm114-release
      - name: Verify prepared Field Capture Migration 115 release package
        run: npm run verify:pm115-release
      - name: Run Field Capture server sync contracts
        run: npx vitest run src/field-capture-rules.test.ts src/field-capture-api.contract.test.ts src/migration-115-field-capture-server-sync.contract.test.ts src/migration-115-field-capture-release-package.contract.test.ts
      - name: Build backend application
        run: npm run build
      - name: Typecheck backend API
        run: npx tsc -p api/tsconfig.json --noEmit
      - name: Build production Docker image
        run: docker build -t pke-api-ci .
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --include=dev --no-audit
      - name: Typecheck frontend
        run: npm run typecheck --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
