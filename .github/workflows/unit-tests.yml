name: Unit Tests

on:
  push:
    branches:
      - phase0/reconcile-source-20261117
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci --include=dev
      - name: Run offline security and unit tests
        run: npm test
